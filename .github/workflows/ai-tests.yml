name: AI tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write  # pour commenter la PR

jobs:
  pr-review:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5-coder:1.5b
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Démarrer Ollama et charger le modèle
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama
          timeout 60 bash -c 'until curl -sf localhost:11434/api/tags; do sleep 1; done'
          docker exec ollama ollama pull qwen2.5-coder:1.5b

      - name: Vérifier l'appel LLM
        run: python ai_tools/llm.py

      - name: Générer des tests IA
        continue-on-error: true
        run: python ai_tools/generate_tests.py specs/pricing.feature --source minishop/pricing.py --out tests/generated/test_pricing_generated.py