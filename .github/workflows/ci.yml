name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Générer les baselines visuelles (UPDATE_BASELINES=1)"
        required: true
        default: false
        type: boolean
jobs:
  lint:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check . --output-format=github"
  test:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'
      - run: pip install -r requirements-dev.txt pytest-xdist
      - run: pytest -n auto -m "unit or api"

  visual:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_baselines) }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Exécuter les tests visuels
        run: |
          uvicorn minishop.api:app --host 127.0.0.1 --port 8000 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/; do sleep 1; done'
          pytest -m visual
      - name: Publier les images de debug visuel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            tests/visual/current
            tests/visual/diff
          if-no-files-found: ignore

  visual-baselines:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baselines }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-dev.txt"
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Générer les baselines visuelles
        env:
          UPDATE_BASELINES: "1"
        run: |
          uvicorn minishop.api:app --host 127.0.0.1 --port 8000 &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/; do sleep 1; done'
          pytest -m visual
      - name: Publier les baselines générées
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/baselines
          if-no-files-found: error